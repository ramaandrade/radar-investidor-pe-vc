<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="36" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>
  <!-- Radar circles -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="96" cy="96" r="46" fill="none" stroke="#475569" stroke-width="2"/>
  <circle cx="96" cy="96" r="24" fill="none" stroke="#64748B" stroke-width="2"/>
  <!-- Target lines -->
  <line x1="96" y1="20" x2="96" y2="172" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="96" x2="172" y2="96" stroke="#334155" stroke-width="2"/>
  <!-- Radar pulse wedge -->
  <path d="M 96 96 L 144 48 A 68 68 0 0 0 96 28 Z" fill="url(#radarGrad)" opacity="0.3"/>
  <!-- Growth trend / Unicorn star -->
  <path d="M 56 126 L 82 102 L 104 116 L 138 68" fill="none" stroke="url(#radarGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="138" cy="68" r="6" fill="#10B981"/>
  <!-- Center dot -->
  <circle cx="96" cy="96" r="5" fill="#38BDF8"/>
